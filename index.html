<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinAdvisor Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b;
  --primary: #2563eb; --primary-light: #eff6ff; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --info-bg: #e0f2fe; --info-text: #0369a1; --info-border: #0ea5e9;
  --font: 'Inter', sans-serif; --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
body { background: var(--bg); color: var(--text-main); font-size: 14px; }

.app-container { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; overflow-y: auto; }
.logo { font-size: 22px; font-weight: 700; margin-bottom: 32px; color: var(--text-main); }
.logo span { color: var(--primary); }

.nav-section-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; margin: 16px 0 8px 12px; }
.nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; margin-bottom: 4px; border: none; background: transparent; border-radius: 8px; color: var(--text-muted); font-weight: 500; text-align: left; cursor: pointer; transition: 0.2s; }
.nav-btn:hover { background: var(--bg); color: var(--text-main); }
.nav-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-btn.action { margin-top: 24px; border: 1px solid var(--border); color: var(--text-main); justify-content: center; }

.main-content { flex: 1; overflow-y: auto; padding: 32px 48px; }
.header-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.header-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

.info-box { background: var(--info-bg); border-left: 4px solid var(--info-border); padding: 16px; border-radius: 4px; color: var(--info-text); font-size: 13px; line-height: 1.5; margin-bottom: 24px; }
.info-box strong { color: #0c4a6e; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
.stat-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.stat-value { font-size: 24px; font-weight: 700; }
.text-primary { color: var(--primary); } .text-success { color: var(--success); } .text-danger { color: var(--danger); }

.control-group { margin-bottom: 16px; }
.control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.control-label { font-size: 13px; font-weight: 500; }
.control-output { font-size: 13px; font-weight: 600; color: var(--primary); background: var(--primary-light); padding: 4px 8px; border-radius: 6px; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-top: 4px; }
